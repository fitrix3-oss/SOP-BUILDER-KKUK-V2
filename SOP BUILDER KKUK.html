<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOP BUILDER KKUK</title>
<meta property="og:title" content="SOP BUILDER KKUK">

<style>
/* ---- Theme tokens (src/styles.css) ---- */
:root {
  --color-paper: #f5f7fc;
  --color-ink: #0b1f4d;
  --color-marker: #fcc419;
  --color-tidak: #d7263d;
  --font-display: "Fraunces", Georgia, serif;
  --font-sans: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; border: 0 solid; margin: 0; padding: 0; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; background: transparent; border-radius: 0; }
button { cursor: pointer; }
button:disabled { cursor: default; }
img, svg { display: block; }
ol, ul { list-style: none; }
body {
  margin: 0; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; line-height: 1.5; min-height: 100%;
}
[hidden] { display: none !important; }

.input {
  width: 100%; border-radius: 8px; border: 1px solid rgba(11,31,77,.15); background: #fff; padding: 8px 12px;
  font-size: 14px; line-height: 20px; color: var(--color-ink); transition: all .15s;
}
.input::placeholder { color: rgba(11,31,77,.35); }
.input:focus { border-color: var(--color-ink); outline: none; box-shadow: 0 0 0 2px rgba(252,196,25,.5); }
textarea.input { resize: vertical; display: block; }
.input.w-24 { width: 96px; }
.input.flex-1 { flex: 1 1 0%; width: auto; min-width: 0; }

/* Drafting-table backdrop behind the chart */
.desk {
  background-color: #e8edf7;
  background-image: linear-gradient(rgba(11,31,77,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(11,31,77,.06) 1px, transparent 1px);
  background-size: 24px 24px; min-height: 100%; padding: 16px;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .5; } }

/* ---- Layout ---- */
.app { display: flex; min-height: 100vh; flex-direction: column; background: var(--color-paper); color: var(--color-ink); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  border-bottom: 4px solid var(--color-marker); background: var(--color-ink); padding: 12px 16px; color: #fff;
}
.brand { margin-right: auto; display: flex; align-items: center; gap: 12px; }
.brand img { width: 48px; height: 48px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.2); }
.brand h1 { font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.025em; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sep { display: none; margin: 0 4px; height: 24px; width: 1px; background: rgba(255,255,255,.25); }
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; border: 1px solid rgba(11,31,77,.15); background: #fff;
  padding: 8px 12px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-ink); transition: all .15s;
}
.tool-btn:hover { border-color: var(--color-ink); background: var(--color-paper); }
.tool-btn:active { transform: scale(.97); }
.save-btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; background: var(--color-marker); padding: 8px 16px;
  font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); box-shadow: 3px 3px 0 0 #fff; transition: all .15s;
}
.save-btn:hover { transform: translateY(-2px); }
.save-btn:active { transform: translateY(0); box-shadow: none; }
.save-btn:disabled { opacity: .6; }
.size-4 { width: 16px; height: 16px; flex: none; }
.size-5 { width: 20px; height: 20px; flex: none; }
.size-10 { width: 40px; height: 40px; flex: none; }
.spin { animation: spin 1s linear infinite; }
.fill-marker { fill: var(--color-marker); }

.body { display: flex; flex: 1 1 0%; flex-direction: column; }
.editor { width: 100%; border-color: rgba(11,31,77,.1); }
.editor-inner { padding: 16px; }
.editor-inner > * + * { margin-top: 20px; }
.editor-head { display: flex; align-items: center; justify-content: space-between; }
.editor-head h2 { font-family: var(--font-display); font-size: 16px; line-height: 24px; font-weight: 600; }
.pill { border-radius: 9999px; background: rgba(252,196,25,.3); padding: 2px 10px; font-size: 12px; line-height: 16px; font-weight: 600; }
#steps > li + li { margin-top: 12px; }
.add-wrap { padding-bottom: 32px; }
.add-btn {
  display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 8px; border-radius: 12px;
  border: 2px dashed rgba(11,31,77,.25); padding: 12px 0; font-size: 14px; line-height: 20px; font-weight: 600; transition: all .15s;
}
.add-btn:hover { border-color: var(--color-ink); background: #fff; }
.add-btn:active { transform: scale(.98); }

.preview { position: relative; flex: 1 1 0%; }
.pv-bar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid rgba(11,31,77,.1); background: rgba(245,247,252,.8); padding: 8px 16px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.pv-bar p { font-size: 12px; line-height: 16px; color: rgba(11,31,77,.6); }
.zoom { display: flex; align-items: center; gap: 4px; border-radius: 8px; border: 1px solid rgba(11,31,77,.15); background: #fff; padding: 2px; }
.zoom span { width: 48px; text-align: center; font-size: 12px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.print-area {
  margin: 0 auto; transform-origin: top; background: #fff; transition: max-width .2s;
  box-shadow: 0 0 0 1px rgba(11,31,77,.1), 0 1px 0 rgba(0,0,0,.04), 0 20px 50px -20px rgba(11,31,77,.35);
}
.print-area svg.flowchart { display: block; height: auto; width: 100%; }

.footer {
  flex-shrink: 0; border-top: 4px solid var(--color-marker); background: var(--color-ink); padding: 12px 16px; text-align: center;
  font-size: 12px; line-height: 16px; color: rgba(255,255,255,.8);
}

/* ---- Step card ---- */
.card {
  border-radius: 12px; border: 1px solid rgba(11,31,77,.12); background: #fff; padding: 14px; transition: all .15s;
}
.card:not(.selected):hover { border-color: rgba(11,31,77,.3); }
.card.selected { border-color: var(--color-ink); box-shadow: 4px 4px 0 0 var(--color-marker); }
.card-top { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.num {
  display: flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 6px; background: var(--color-ink);
  font-size: 12px; line-height: 16px; font-weight: 700; color: var(--color-paper); font-variant-numeric: tabular-nums;
}
.type-wrap { position: relative; display: block; }
.type-select {
  appearance: none; -webkit-appearance: none; border-radius: 6px; border: 1px solid rgba(11,31,77,.15); background: var(--color-paper);
  padding: 4px 12px 4px 28px; font-size: 14px; line-height: 20px; font-weight: 600;
}
.type-select:focus { border-color: var(--color-ink); outline: none; }
.type-icon { pointer-events: none; position: absolute; left: 8px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); }
.type-icon svg { width: 14px; height: 14px; }
.card-actions { margin-left: auto; display: flex; align-items: center; opacity: .6; transition: opacity .15s; }
.card:hover .card-actions { opacity: 1; }
.icon-btn { border-radius: 6px; padding: 6px; transition: all .15s; line-height: 0; }
.icon-btn:hover { background: rgba(11,31,77,.05); }
.icon-btn.danger:hover { background: rgba(215,38,61,.1); color: var(--color-tidak); }
.icon-btn:disabled { opacity: .25; }
.icon-btn:disabled:hover { background: transparent; }
.stack > :not(:last-child) { margin-bottom: 10px; }
.field { display: block; }
.field > span {
  margin-bottom: 4px; display: block; font-size: 11px; line-height: 16.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .05em; color: rgba(11,31,77,.55);
}
.hint { margin-top: -4px; font-size: 11px; line-height: 1.375; color: rgba(11,31,77,.55); }
.row { display: flex; gap: 8px; }
.check { display: flex; width: fit-content; cursor: pointer; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--color-ink); }
.check span { padding: 0 4px; }
.check span.on { border-radius: 4px; background: rgba(252,196,25,.7); }
.tidak-box {
  margin-top: 4px; border-radius: 8px; border: 1px dashed rgba(215,38,61,.4); background: rgba(215,38,61,.04); padding: 12px;
}
.tidak-box .t-title { font-size: 12px; line-height: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--color-tidak); }

/* ---- Export menu ---- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; z-index: 40; margin-top: 6px; width: 224px; overflow: hidden; border-radius: 12px;
  border: 1px solid rgba(11,31,77,.15); background: #fff; padding: 4px; color: var(--color-ink);
  box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); animation: pop .15s ease-out;
}
.menu button {
  display: flex; width: 100%; align-items: center; gap: 12px; border-radius: 8px; padding: 8px 12px; text-align: left; transition: background .15s;
}
.menu button:hover { background: var(--color-paper); }
.menu .m-label { display: block; font-size: 14px; line-height: 20px; font-weight: 600; }
.menu .m-hint { display: block; font-size: 12px; line-height: 16px; color: rgba(11,31,77,.55); }
.chev { width: 14px; height: 14px; transition: transform .15s; }
.chev.open { transform: rotate(180deg); }

/* ---- Overlays ---- */
.overlay-drawer {
  position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(11,31,77,.3);
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.drawer {
  display: flex; height: 100%; width: 100%; max-width: 448px; flex-direction: column; background: var(--color-paper);
  box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: slide .25s ease-out;
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(11,31,77,.1); padding: 16px 20px; }
.drawer-head h2, .dialog h2 { font-family: var(--font-display); font-size: 18px; line-height: 28px; font-weight: 600; }
.search-wrap { border-bottom: 1px solid rgba(11,31,77,.1); padding: 12px 16px; }
.search {
  display: flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid rgba(11,31,77,.15); background: #fff; padding: 8px 12px;
}
.search:focus-within { border-color: var(--color-ink); }
.search svg { color: rgba(11,31,77,.5); }
.search input { width: 100%; background: transparent; font-size: 14px; line-height: 20px; outline: none; }
.drawer-body { flex: 1 1 0%; overflow-y: auto; padding: 16px; }
.err-box { border-radius: 8px; border: 1px solid rgba(215,38,61,.3); background: rgba(215,38,61,.05); padding: 16px; font-size: 14px; line-height: 20px; }
.err-box button { font-weight: 600; text-decoration: underline; }
.skel { height: 64px; border-radius: 8px; background: rgba(11,31,77,.05); animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
.skel + .skel { margin-top: 8px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 24px; text-align: center; }
.empty .e-title { font-family: var(--font-display); font-size: 18px; line-height: 28px; }
.empty .e-sub { font-size: 14px; line-height: 20px; color: rgba(11,31,77,.6); }
.lib-list > li + li { margin-top: 8px; }
.lib-item { display: flex; align-items: center; gap: 12px; border-radius: 8px; border: 1px solid rgba(11,31,77,.1); background: #fff; padding: 12px; }
.lib-item.current { border-color: var(--color-ink); }
.lib-item .open-btn { min-width: 0; flex: 1 1 0%; text-align: left; }
.lib-item .l-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lib-item .l-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; color: rgba(11,31,77,.7); }
.lib-item .l-date { font-size: 12px; line-height: 16px; color: rgba(11,31,77,.55); }
.lib-none { padding: 32px 8px; text-align: center; font-size: 14px; line-height: 20px; color: rgba(11,31,77,.6); }

.overlay-dialog {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(11,31,77,.3); padding: 16px;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.dialog {
  width: 100%; max-width: 448px; border-radius: 12px; background: var(--color-paper); padding: 20px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); animation: pop .15s ease-out;
}
.dialog-head { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.dialog .input-plain {
  width: 100%; border-radius: 8px; border: 1px solid rgba(11,31,77,.2); background: #fff; padding: 8px 12px; font-size: 14px; line-height: 20px; outline: none;
}
.dialog .input-plain:focus { border-color: var(--color-ink); }
.dialog .d-note { margin-top: 8px; font-size: 12px; line-height: 16px; color: rgba(11,31,77,.6); }
.dialog .d-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
.btn-cancel {
  border-radius: 8px; border: 1px solid rgba(11,31,77,.15); background: #fff; padding: 8px 16px; font-size: 14px; line-height: 20px; font-weight: 500; transition: border-color .15s;
}
.btn-cancel:hover { border-color: var(--color-ink); }
.btn-ok {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; background: var(--color-ink); padding: 8px 16px;
  font-size: 14px; line-height: 20px; font-weight: 600; color: #fff; transition: background .15s;
}
.btn-ok:hover { background: rgba(11,31,77,.9); }

.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; z-index: 50; transform: translateX(-50%); animation: rise .25s ease-out;
  border-radius: 8px; background: var(--color-ink); padding: 10px 16px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-paper);
  box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); max-width: calc(100vw - 24px);
}

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border-width: 0; }

/* sm: 640 */
@media (min-width: 640px) { .sep { display: block; } }
/* md: 768 */
@media (min-width: 768px) {
  .topbar { padding-left: 24px; padding-right: 24px; }
  .editor-inner { padding: 24px; }
  .pv-bar { padding-left: 24px; padding-right: 24px; }
  .desk { padding: 40px; }
  .footer { padding-left: 24px; padding-right: 24px; }
}
/* lg: 1024 */
@media (min-width: 1024px) {
  .app { height: 100vh; }
  .body { min-height: 0; flex-direction: row; }
  .editor { width: 440px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid rgba(11,31,77,.1); }
  .preview { min-height: 0; overflow: auto; }
}

@media print {
  @page { size: A4 portrait; margin: 10mm; }
  .no-print, [data-ui] { display: none !important; }
  body, .desk { background: #fff !important; }
  .desk { padding: 0 !important; }
  .print-area { max-width: none !important; box-shadow: none !important; }
  .app { height: auto !important; }
  .preview, .editor { overflow: visible !important; }
}
</style>
</head>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * src/lib/sop.ts
   * ===================================================================== */
  var STEP_TYPE_LABEL = {
    start: 'Mula (Bujur)',
    process: 'Tindakan (Kotak)',
    decision: 'Pilihan (Diamond)',
    connectorStart: 'Penyambung Awal (Bulat)',
    connectorEnd: 'Penyambung Akhir (Bulat)',
    end: 'Tamat (Bujur)'
  };
  var STEP_TYPES = Object.keys(STEP_TYPE_LABEL);
  var UNITS = ['Minit', 'Jam', 'Hari'];

  function isTerminalOut(t) { return t === 'end' || t === 'connectorEnd'; }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function makeStep(type, patch) {
    var s = {
      id: uid(),
      type: type,
      responsibility: '',
      description: type === 'start' ? 'Mula' : type === 'end' ? 'Tamat' : '',
      label: '',
      duration: null,
      unit: 'Minit',
      noText: '',
      loopTo: null,
      highlight: false,
      noHighlight: false
    };
    if (patch) for (var k in patch) s[k] = patch[k];
    return s;
  }

  /** Sums durations and presents them grouped by unit, e.g. "1 Hari 3 Minit". */
  function totalDuration(steps) {
    var totals = { Hari: 0, Jam: 0, Minit: 0 };
    steps.forEach(function (s) {
      if (s.duration && s.duration > 0) totals[s.unit] += s.duration;
    });
    var parts = ['Hari', 'Jam', 'Minit']
      .filter(function (u) { return totals[u] > 0; })
      .map(function (u) { return +totals[u].toFixed(2) + ' ' + u; });
    return parts.length ? parts.join(' ') : '-';
  }

  function blankSop() {
    return { title: 'SOP Baharu', reference: '', steps: [makeStep('start')] };
  }

  function str(v) { return typeof v === 'string' ? v : ''; }

  /** Turns untrusted data (saved rows, imported JSON) into a valid Sop. */
  function normalizeSop(raw) {
    var r = raw;
    if (!r || typeof r !== 'object' || !Array.isArray(r.steps)) return null;
    var steps = r.steps
      .filter(function (s) { return !!s && typeof s === 'object' && STEP_TYPES.indexOf(s.type) > -1; })
      .slice(0, 200)
      .map(function (s) {
        return {
          id: str(s.id) || uid(),
          type: s.type,
          responsibility: str(s.responsibility),
          description: str(s.description),
          label: str(s.label),
          duration: typeof s.duration === 'number' && isFinite(s.duration) ? s.duration : null,
          unit: UNITS.indexOf(s.unit) > -1 ? s.unit : 'Minit',
          noText: str(s.noText),
          loopTo: typeof s.loopTo === 'string' ? s.loopTo : null,
          highlight: typeof s.highlight === 'boolean' ? s.highlight : s.type === 'decision',
          noHighlight: typeof s.noHighlight === 'boolean' ? s.noHighlight : true
        };
      });
    var ids = {};
    steps.forEach(function (s) { ids[s.id] = true; });
    steps.forEach(function (s) { if (s.loopTo && !ids[s.loopTo]) s.loopTo = null; });
    return { title: str(r.title) || 'SOP Baharu', reference: str(r.reference), steps: steps };
  }

  /* =====================================================================
   * src/lib/layout.ts  (pure layout engine)
   * ===================================================================== */
  var FONT_FAMILY = 'Arial, Helvetica, sans-serif';
  function font(size, bold) { return (bold ? 'bold ' : '') + size + 'px ' + FONT_FAMILY; }

  var CHART = {
    width: 1220, margin: 40,
    respX: 40, respW: 220,
    flowX: 280, flowW: 460,
    laneX: 292, laneW: 160,
    mainCx: 600, shapeW: 190,
    procX: 760, procW: 300,
    durX: 1080, durW: 100,
    rowPad: 30
  };
  var YELLOW = '#FFFF00';
  var STYLE = {
    header: { size: 20, bold: true, lh: 26 },
    resp: { size: 19, bold: true, lh: 23 },
    proc: { size: 18, bold: false, lh: 23 },
    dur: { size: 18, bold: true, lh: 23 },
    shape: { size: 16, bold: false, lh: 21 },
    branch: { size: 16, bold: true, lh: 21 }
  };

  function createMeasure() {
    var ctx = document.createElement('canvas').getContext('2d');
    return function (text, f) { ctx.font = f; return ctx.measureText(text).width; };
  }

  /** Greedy word wrap; words longer than the line are broken by character. */
  function wrapText(text, maxW, f, measure) {
    var out = [];
    var paras = text.split('\n');
    for (var p = 0; p < paras.length; p++) {
      var words = paras[p].split(/\s+/).filter(Boolean);
      if (!words.length) {
        if (text.trim()) out.push('');
        continue;
      }
      var line = '';
      for (var w = 0; w < words.length; w++) {
        var word = words[w];
        var candidate = line ? line + ' ' + word : word;
        if (measure(candidate, f) <= maxW) { line = candidate; continue; }
        if (line) out.push(line);
        line = '';
        while (measure(word, f) > maxW && word.length > 1) {
          var i = word.length - 1;
          while (i > 1 && measure(word.slice(0, i) + '-', f) > maxW) i--;
          out.push(word.slice(0, i) + '-');
          word = word.slice(i);
        }
        line = word;
      }
      if (line) out.push(line);
    }
    return out;
  }

  function block(lines, style, x, cy, anchor, fill) {
    var total = lines.length * style.lh;
    var top = cy - total / 2;
    return {
      x: x,
      y: top + (style.lh - style.size) / 2 + style.size * 0.82,
      lines: lines, size: style.size, bold: style.bold, lh: style.lh,
      anchor: anchor, fill: fill || '#000'
    };
  }

  function layoutSop(sop, measure) {
    var C = CHART;
    var texts = [], shapes = [], lines = [], rows = [];
    function wrap(t, w, s) { return wrapText(t, w, font(s.size, s.bold), measure); }

    // Without decisions there is no "Tidak" lane, so centre the flow under its header.
    var hasDecision = sop.steps.some(function (s) { return s.type === 'decision'; });
    var mainCx = hasDecision ? C.mainCx : C.flowX + C.flowW / 2;

    var y = C.margin;

    // Column headers
    var hy = y + STYLE.header.lh / 2;
    texts.push(block(['TANGGUNGJAWAB'], STYLE.header, C.respX, hy, 'start'));
    texts.push(block(['ALIRAN KERJA'], STYLE.header, C.flowX + C.flowW / 2, hy, 'middle'));
    texts.push(block(['PROSES KERJA'], STYLE.header, C.procX, hy, 'start'));
    texts.push(block(['TEMPOH MASA'], STYLE.header, C.width - C.margin, hy, 'end'));
    y += STYLE.header.lh + 16;
    lines.push({ points: [[C.margin, y], [C.width - C.margin, y]], arrow: false, width: 2.5 });
    y += 24;

    // Measure every row
    var measured = sop.steps.map(function (step) {
      var resp = wrap(step.responsibility, C.respW, STYLE.resp);
      var proc = wrap(step.description, C.procW, STYLE.proc);
      var dur = step.duration && step.duration > 0 ? wrap(step.duration + ' ' + step.unit, C.durW, STYLE.dur) : [];
      var label = [];
      var shapeW = C.shapeW;
      var shapeH = 64;
      if (step.type === 'start' || step.type === 'end') {
        label = wrap(step.label, shapeW - 44, STYLE.shape);
        shapeH = Math.max(72, label.length * STYLE.shape.lh + 40);
      } else if (step.type === 'connectorStart' || step.type === 'connectorEnd') {
        // A w×h text box fits inside a circle whose diameter is the box diagonal.
        label = wrap(step.label, 110, STYLE.shape);
        var tw = Math.max.apply(null, [0].concat(label.map(function (l) { return measure(l, font(STYLE.shape.size, STYLE.shape.bold)); })));
        var th = label.length * STYLE.shape.lh;
        shapeW = shapeH = Math.max(56, Math.ceil(Math.hypot(tw, th)) + 16);
      } else if (step.type === 'process') {
        shapeW = Math.round(C.shapeW * 0.9);
        label = wrap(step.label, shapeW - 24, STYLE.shape);
        shapeH = Math.max(76, label.length * STYLE.shape.lh + 34);
      } else {
        // A w×h text box fits inside a diamond of width W when h ≤ H·(1 − w/W).
        var textW = 96;
        label = wrap(step.label, textW, STYLE.shape);
        var textH = label.length * STYLE.shape.lh;
        shapeH = Math.max(110, Math.ceil(textH / (1 - textW / shapeW)) + 18);
      }
      var hasBranch = step.type === 'decision' && !!step.noText.trim();
      var branch = hasBranch ? wrap(step.noText, C.laneW - 20, STYLE.branch) : [];
      var branchH = hasBranch ? Math.max(48, branch.length * STYLE.branch.lh + 22) : 0;
      var contentH = Math.max(
        resp.length * STYLE.resp.lh,
        proc.length * STYLE.proc.lh,
        dur.length * STYLE.dur.lh,
        shapeH,
        branchH
      );
      return { step: step, resp: resp, proc: proc, dur: dur, label: label, branch: branch, shapeW: shapeW, shapeH: shapeH, hasBranch: hasBranch, branchH: branchH, rowH: contentH + C.rowPad * 2 };
    });

    // Place rows
    var centers = [];
    measured.forEach(function (m) {
      var cy = y + m.rowH / 2;
      centers.push(cy);
      rows.push({ stepId: m.step.id, y: y, h: m.rowH });
      var step = m.step;
      if (m.resp.length) texts.push(block(m.resp, STYLE.resp, C.respX, cy, 'start'));
      if (m.proc.length) texts.push(block(m.proc, STYLE.proc, C.procX, cy, 'start'));
      if (m.dur.length) texts.push(block(m.dur, STYLE.dur, C.durX + C.durW / 2, cy, 'middle'));

      var kind =
        step.type === 'process' ? 'rect'
        : step.type === 'decision' ? 'diamond'
        : step.type === 'connectorStart' || step.type === 'connectorEnd' ? 'circle'
        : 'ellipse';
      shapes.push({ stepId: step.id, kind: kind, cx: mainCx, cy: cy, w: m.shapeW, h: m.shapeH, fill: step.highlight ? YELLOW : '#FFFFFF' });
      if (m.label.length) texts.push(block(m.label, STYLE.shape, mainCx, cy, 'middle'));

      if (m.hasBranch) {
        shapes.push({ stepId: step.id, kind: 'branch', cx: C.laneX + C.laneW / 2, cy: cy, w: C.laneW, h: m.branchH, fill: step.noHighlight ? YELLOW : '#FFFFFF' });
        texts.push(block(m.branch, STYLE.branch, C.laneX + C.laneW / 2, cy, 'middle'));
      }
      y += m.rowH;
    });

    // Main downward connectors
    for (var i = 0; i < measured.length - 1; i++) {
      var a = measured[i];
      var b = measured[i + 1];
      if (isTerminalOut(a.step.type)) continue;
      var y1 = centers[i] + a.shapeH / 2;
      var y2 = centers[i + 1] - b.shapeH / 2;
      lines.push({ points: [[mainCx, y1], [mainCx, y2]], arrow: true });
      if (a.step.type === 'decision') {
        texts.push(block(['Ya'], STYLE.branch, mainCx + 10, y1 + 16, 'start'));
      }
    }

    // "Tidak" branches and loop-back connectors
    var indexById = {};
    sop.steps.forEach(function (s, idx) { indexById[s.id] = idx; });
    var gutterLoops = 0;
    measured.forEach(function (m, i) {
      if (m.step.type !== 'decision') return;
      var target = m.step.loopTo ? indexById[m.step.loopTo] : undefined;
      var hasLoop = target !== undefined && target !== i;
      if (!m.hasBranch && !hasLoop) return;

      var cy = centers[i];
      var diamondLeft = mainCx - m.shapeW / 2;
      var laneCx = C.laneX + C.laneW / 2;
      var laneRight = C.laneX + C.laneW;
      texts.push(block(['Tidak'], STYLE.branch, (diamondLeft + laneRight) / 2, cy - 12, 'middle', '#E00000'));

      if (m.hasBranch) {
        lines.push({ points: [[diamondLeft, cy], [laneRight, cy]], arrow: true });
      }
      if (!hasLoop) return;

      var t = measured[target];
      var ty = centers[target];
      var entryX = mainCx - t.shapeW / 2;
      var lo = Math.min(i, target);
      var hi = Math.max(i, target);
      var obstructed = measured.slice(lo + 1, hi).some(function (x) { return x.hasBranch; }) || t.hasBranch;
      var up = target < i;

      if (!obstructed) {
        var pts = m.hasBranch
          ? [[laneCx, up ? cy - m.branchH / 2 : cy + m.branchH / 2]]
          : [[diamondLeft, cy], [laneCx, cy]];
        lines.push({ points: pts.concat([[laneCx, ty], [entryX, ty]]), arrow: true });
        return;
      }
      // Route through the gutter left of the lane so other branch boxes stay clear
      var gx = C.laneX - 8 - 6 * (gutterLoops++ % 3);
      var ex = entryX;
      var ey = ty;
      if (t.hasBranch) {
        // Pass just above the target's own branch box and land on the diamond edge
        var half = t.shapeH / 2;
        var d = Math.min(t.branchH / 2 + 10, half - 6);
        ey = ty - d;
        ex = mainCx - (t.shapeW / 2) * (1 - d / half);
      }
      lines.push({
        points: [[m.hasBranch ? C.laneX : diamondLeft, cy], [gx, cy], [gx, ey], [ex, ey]],
        arrow: true
      });
    });

    // Footer
    y += 20;
    lines.push({ points: [[C.margin, y], [C.width - C.margin, y]], arrow: false, dashed: true, width: 2.5 });
    y += 40;
    texts.push(block(['Jumlah Masa Keseluruhan: ' + totalDuration(sop.steps)], { size: 20, bold: true, lh: 26 }, C.width - C.margin, y, 'end'));
    y += 40;

    return { width: C.width, height: y, texts: texts, shapes: shapes, lines: lines, rows: rows };
  }

  /* =====================================================================
   * src/components/FlowChart.tsx  -> SVG string
   * ===================================================================== */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function flowChartSvg(layout, selectedId) {
    var o = [];
    o.push('<svg id="flowchart" class="flowchart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + layout.width + ' ' + layout.height + '" width="' + layout.width + '" height="' + layout.height + '" font-family="' + FONT_FAMILY + '">');
    o.push('<defs><marker id="sop-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>');
    o.push('<rect width="' + layout.width + '" height="' + layout.height + '" fill="#fff"/>');

    layout.rows.forEach(function (r) {
      o.push('<rect data-ui="row" data-step="' + esc(r.stepId) + '" x="0" y="' + r.y + '" width="' + layout.width + '" height="' + r.h + '" fill="' + (r.stepId === selectedId ? 'rgba(234, 179, 8, 0.12)' : 'transparent') + '" style="cursor:pointer"/>');
    });

    layout.lines.forEach(function (l) {
      o.push('<polyline points="' + l.points.map(function (p) { return p.join(','); }).join(' ') + '" fill="none" stroke="#000" stroke-width="' + (l.width != null ? l.width : 2.5) + '"' + (l.dashed ? ' stroke-dasharray="12 8"' : '') + ' stroke-linejoin="miter"' + (l.arrow ? ' marker-end="url(#sop-arrow)"' : '') + ' pointer-events="none"/>');
    });

    layout.shapes.forEach(function (s) {
      var common = ' fill="' + s.fill + '" stroke="#000" stroke-width="2.5" pointer-events="none"';
      if (s.kind === 'ellipse' || s.kind === 'circle') {
        o.push('<ellipse cx="' + s.cx + '" cy="' + s.cy + '" rx="' + s.w / 2 + '" ry="' + s.h / 2 + '"' + common + '/>');
      } else if (s.kind === 'diamond') {
        var pts = [[s.cx, s.cy - s.h / 2], [s.cx + s.w / 2, s.cy], [s.cx, s.cy + s.h / 2], [s.cx - s.w / 2, s.cy]];
        o.push('<polygon points="' + pts.map(function (p) { return p.join(','); }).join(' ') + '"' + common + '/>');
      } else {
        o.push('<rect x="' + (s.cx - s.w / 2) + '" y="' + (s.cy - s.h / 2) + '" width="' + s.w + '" height="' + s.h + '" rx="' + (s.kind === 'branch' ? 6 : 0) + '"' + common + '/>');
      }
    });

    layout.texts.forEach(function (t) {
      o.push('<text x="' + t.x + '" y="' + t.y + '" font-size="' + t.size + '" font-weight="' + (t.bold ? 700 : 400) + '" text-anchor="' + t.anchor + '" fill="' + t.fill + '" pointer-events="none">' +
        t.lines.map(function (line, j) { return '<tspan x="' + t.x + '" dy="' + (j === 0 ? 0 : t.lh) + '">' + esc(line) + '</tspan>'; }).join('') + '</text>');
    });

    o.push('</svg>');
    return o.join('');
  }

  /* =====================================================================
   * src/lib/export.ts
   * ===================================================================== */
  function slug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'carta-alir-sop';
  }

  function serialize(svg) {
    var clone = svg.cloneNode(true);
    clone.querySelectorAll('[data-ui]').forEach(function (el) { el.remove(); });
    clone.removeAttribute('class');
    clone.removeAttribute('id');
    return new XMLSerializer().serializeToString(clone);
  }

  /** Hands a generated file to the viewer (downloads capability), or falls back to a normal download. */
  function deliver(filename, data) {
    var viewer = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : Promise.resolve(null);
    return Promise.resolve(viewer).then(function (dl) {
      if (dl) {
        return dl.save({ filename: filename, data: data }).catch(function (err) {
          if (err && err.code === 'declined') return;
          throw err;
        });
      }
      var blob = data instanceof Blob ? data : new Blob([data]);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });
  }

  function exportSvg(svg, name) {
    return deliver(slug(name) + '.svg', new Blob([serialize(svg)], { type: 'image/svg+xml' }));
  }

  function renderCanvas(svg, scale) {
    var w = svg.viewBox.baseVal.width;
    var h = svg.viewBox.baseVal.height;
    var url = URL.createObjectURL(new Blob([serialize(svg)], { type: 'image/svg+xml' }));
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas);
      };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function canvasBlob(c) {
    return new Promise(function (res, rej) { c.toBlob(function (x) { x ? res(x) : rej(new Error('png')); }, 'image/png'); });
  }

  function exportPng(svg, name, scale) {
    return renderCanvas(svg, scale || 2).then(canvasBlob).then(function (b) { return deliver(slug(name) + '.png', b); });
  }

  /**
   * Word document (A4 portrait) with the chart as images. Long charts are split
   * into one image per page, cutting between rows so no shape is sliced.
   * `breaks` are the y positions (chart units) where a cut is allowed.
   */
  function exportDoc(svg, name, breaks) {
    if (typeof JSZip === 'undefined') return Promise.reject(new Error('jszip'));
    var scale = 2;
    return renderCanvas(svg, scale).then(function (canvas) {
      var chartW = svg.viewBox.baseVal.width;
      var chartH = svg.viewBox.baseVal.height;
      // A4 with 0.75in margins, in 96-dpi pixels
      var pageW = (8.27 - 1.5) * 96;
      var pageH = (11.69 - 1.5) * 96 - 12;
      var maxSlice = (pageH * chartW) / pageW;

      var slices = [];
      var top = 0;
      while (top < chartH - 1) {
        var bottom = Math.min(chartH, top + maxSlice);
        if (bottom < chartH) {
          var cands = breaks.filter(function (b) { return b > top + maxSlice * 0.3 && b <= bottom; });
          var cut = cands.pop();
          if (cut) bottom = cut;
        }
        slices.push([top, bottom]);
        top = bottom;
      }

      return Promise.all(slices.map(function (sl) {
        var t = sl[0], b = sl[1];
        var c = document.createElement('canvas');
        c.width = canvas.width;
        c.height = Math.ceil((b - t) * scale);
        c.getContext('2d').drawImage(canvas, 0, -t * scale);
        return canvasBlob(c).then(function (blob) { return blob.arrayBuffer(); }).then(function (data) {
          return { data: data, h: ((b - t) * pageW) / chartW };
        });
      })).then(function (pieces) {
        var EMU = 9525;
        var cx = Math.round(pageW * EMU);
        var paras = pieces.map(function (p, i) {
          var cy = Math.round(p.h * EMU);
          return '<w:p><w:pPr>' + (i > 0 ? '<w:pageBreakBefore/>' : '') + '<w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:drawing>' +
            '<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="' + cx + '" cy="' + cy + '"/>' +
            '<wp:docPr id="' + (i + 1) + '" name="Carta ' + (i + 1) + '"/>' +
            '<wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>' +
            '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>' +
            '<pic:nvPicPr><pic:cNvPr id="' + (i + 1) + '" name="carta' + (i + 1) + '.png"/><pic:cNvPicPr/></pic:nvPicPr>' +
            '<pic:blipFill><a:blip r:embed="rId' + (i + 1) + '"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
            '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
            '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
        }).join('');
        var docXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
          'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
          'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>' + paras +
          '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>' +
          '</w:body></w:document>';
        var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          pieces.map(function (p, i) { return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/carta' + (i + 1) + '.png"/>'; }).join('') +
          '</Relationships>';
        var zip = new JSZip();
        zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
        zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
        zip.file('word/document.xml', docXml);
        zip.file('word/_rels/document.xml.rels', rels);
        pieces.forEach(function (p, i) { zip.file('word/media/carta' + (i + 1) + '.png', p.data); });
        return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      });
    }).then(function (blob) { return deliver(slug(name) + '.docx', blob); });
  }

  function exportJson(sop, name) {
    var json = JSON.stringify({ format: 'pembina-sop', version: 1, sop: sop }, null, 2);
    return deliver(slug(name) + '.json', new Blob([json], { type: 'application/json' }));
  }

  function readJsonFile(file) {
    return file.text().then(function (t) {
      var data = JSON.parse(t);
      return data && typeof data === 'object' && 'sop' in data ? data.sop : data;
    });

  /* =====================================================================
   * Persistence (replaces src/server/sops.functions.ts + Netlify Database)
   * Uses the viewer's shared database when available, else this browser.
   * ===================================================================== */
  var LOCAL_KEY = 'sop-builder-kkuk:sops';
  var dbPromise = (function () {
    try {
      if (window.claude && typeof window.claude.use === 'function') return Promise.resolve(window.claude.use('db')).catch(function () { return null; });
    } catch (e) { /* ignore */ }
    return Promise.resolve(null);
  })();

  function localRead() {
    try { var v = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function localWrite(list) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
  }

  var Store = {
    list: function () {
      return dbPromise.then(function (db) {
        if (db) {
          return db.collection('sops').orderBy('updatedAt', 'desc').limit(100).get().then(function (snap) {
            return snap.docs.map(function (d) {
              var x = d.data() || {};
              return { id: d.id, projectName: x.projectName || null, title: String(x.title || ''), updatedAt: new Date(x.updatedAt || 0).toISOString() };
            });
          });
        }
        return localRead().map(function (r) { return { id: r.id, projectName: r.projectName || null, title: r.title, updatedAt: r.updatedAt }; })
          .sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });
      });
    },
    get: function (id) {
      return dbPromise.then(function (db) {
        if (db) {
          return db.doc('sops/' + id).get().then(function (snap) {
            if (!snap.exists) return null;
            var x = snap.data() || {};
            var sop = normalizeSop(x.data);
            return sop ? { id: snap.id, projectName: x.projectName || null, sop: sop } : null;
          });
        }
        var row = localRead().filter(function (r) { return r.id === id; })[0];
        if (!row) return null;
        var s = normalizeSop(row.data);
        return s ? { id: row.id, projectName: row.projectName || null, sop: s } : null;
      });
    },
    save: function (id, projectName, rawSop) {
      var sop = normalizeSop(JSON.parse(JSON.stringify(rawSop)));
      if (!sop) return Promise.reject(new Error('Data SOP tidak sah'));
      if (sop.steps.length > 200) return Promise.reject(new Error('Terlalu banyak langkah'));
      var title = sop.title.trim().slice(0, 300) || 'SOP Tanpa Tajuk';
      var pn = String(projectName == null ? '' : projectName).trim().slice(0, 200) || title;
      var now = Date.now();
      return dbPromise.then(function (db) {
        if (db) {
          var col = db.collection('sops');
          var ref = id ? col.doc(id) : null;
          var p = ref ? ref.get() : Promise.resolve({ exists: false });
          return p.then(function (snap) {
            if (snap.exists) {
              var prev = snap.data() || {};
              return ref.set({ title: title, projectName: pn, data: sop, createdAt: prev.createdAt || now, updatedAt: now }).then(function () { return { id: ref.id }; });
            }
            var nref = col.doc();
            return nref.set({ title: title, projectName: pn, data: sop, createdAt: now, updatedAt: now }).then(function () { return { id: nref.id }; });
          });
        }
        var list = localRead();
        var iso = new Date(now).toISOString();
        var row = id ? list.filter(function (r) { return r.id === id; })[0] : null;
        if (row) { row.title = title; row.projectName = pn; row.data = sop; row.updatedAt = iso; }
        else { row = { id: uid() + uid(), title: title, projectName: pn, data: sop, updatedAt: iso }; list.push(row); }
        if (!localWrite(list)) throw new Error('storage');
        return { id: row.id };
      });
    },
    remove: function (id) {
      return dbPromise.then(function (db) {
        if (db) return db.doc('sops/' + id).delete();
        localWrite(localRead().filter(function (r) { return r.id !== id; }));
      });
    }
  };

  /* =====================================================================
   * src/components/SopBuilder.tsx  -> state + rendering
   * ===================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var TYPE_ICON = { start: 'circle', end: 'circle', process: 'square', decision: 'diamond', connectorStart: 'circle', connectorEnd: 'circle' };

  var state = {
    sop: blankSop(), sopId: null, projectName: '', selectedId: null,
    zoom: 0.8, saveState: 'idle', layout: null
  };
  var measure = createMeasure();
  var cardEls = new Map();      // step id -> { li, sig }
  var toastTimer = null;

  function icons() { if (window.lucide && typeof window.lucide.createIcons === 'function') { try { window.lucide.createIcons(); } catch (e) { /* ignore */ } } }
  function icon(name, cls) { return '<i data-lucide="' + name + '" class="' + (cls || 'size-4') + '"></i>'; }

  function showToast(msg) {
    var slot = $('toast-slot');
    slot.innerHTML = '<div class="toast no-print" role="status">' + esc(msg) + '</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { slot.innerHTML = ''; }, 2600);
  }

  function markDirty() { if (state.saveState === 'saved') { state.saveState = 'idle'; renderSaveButton(); } }

  function setSop(sop) { state.sop = sop; }
  function updateSop(patch) { for (var k in patch) state.sop[k] = patch[k]; markDirty(); render(); }
  function updateStep(id, patch) {
    state.sop.steps = state.sop.steps.map(function (st) { if (st.id !== id) return st; var n = {}; for (var k in st) n[k] = st[k]; for (var j in patch) n[j] = patch[j]; return n; });
    markDirty(); render();
  }

  /** New steps are actions; the user changes the type in the step card. */
  function addStep() {
    var steps = state.sop.steps.slice();
    var sel = steps.findIndex(function (st) { return st.id === state.selectedId; });
    var lastEnd = steps.map(function (st) { return st.type; }).lastIndexOf('end');
    var at = sel >= 0 && steps[sel].type !== 'end' ? sel + 1 : lastEnd >= 0 ? lastEnd : steps.length;
    var step = makeStep('process');
    steps.splice(at, 0, step);
    state.selectedId = step.id;
    updateSop({ steps: steps });
  }

  function moveStep(id, dir) {
    var steps = state.sop.steps.slice();
    var i = steps.findIndex(function (st) { return st.id === id; });
    var j = i + dir;
    if (j < 0 || j >= steps.length) return;
    var t = steps[i]; steps[i] = steps[j]; steps[j] = t;
    state.sop.steps = steps; markDirty(); render();
  }

  function duplicateStep(id) {
    var i = state.sop.steps.findIndex(function (st) { return st.id === id; });
    var copy = {}; for (var k in state.sop.steps[i]) copy[k] = state.sop.steps[i][k]; copy.id = uid();
    var steps = state.sop.steps.slice();
    steps.splice(i + 1, 0, copy);
    state.selectedId = copy.id;
    updateSop({ steps: steps });
  }

  function removeStep(id) {
    state.sop.steps = state.sop.steps
      .filter(function (st) { return st.id !== id; })
      .map(function (st) { if (st.loopTo === id) { var n = {}; for (var k in st) n[k] = st[k]; n.loopTo = null; return n; } return st; });
    markDirty(); render();
  }

  function selectFromChart(id) {
    state.selectedId = id;
    render();
    var c = cardEls.get(id);
    if (c) c.li.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function setUrl(id) {
    try {
      var url = new URL(window.location.href);
      if (id) url.searchParams.set('sop', String(id)); else url.searchParams.delete('sop');
      window.history.replaceState(null, '', url);
    } catch (e) { /* sandboxed frames may not allow this */ }
  }

  function handleSave(name) {
    closeOverlay('dialog');
    state.saveState = 'saving'; renderSaveButton();
    Store.save(state.sopId, name, state.sop).then(function (res) {
      state.sopId = res.id;
      state.projectName = name.trim() || state.sop.title.trim();
      setUrl(res.id);
      state.saveState = 'saved'; renderSaveButton();
      showToast('Disimpan sebagai “' + (name.trim() || state.sop.title.trim() || 'SOP Tanpa Tajuk') + '”');
    }).catch(function () {
      state.saveState = 'error'; renderSaveButton();
      showToast('Gagal menyimpan. Cuba lagi.');
    });
  }

  function openSop(id) {
    return Store.get(id).then(function (res) {
      if (!res) { showToast('SOP tidak dijumpai'); setUrl(null); return; }
      setSop(res.sop);
      state.sopId = res.id;
      state.projectName = res.projectName != null ? res.projectName : res.sop.title;
      setUrl(res.id);
      state.selectedId = null;
      state.saveState = 'saved';
      closeOverlay('drawer');
      render(); renderSaveButton();
    }).catch(function () { showToast('Gagal membuka SOP'); });
  }

  function runExport(fn) {
    return Promise.resolve().then(fn).catch(function () { showToast('Gagal mengeksport. Cuba lagi.'); });
  }

  function exportAs(kind) {
    if (kind === 'json') return runExport(function () { return exportJson(state.sop, state.sop.title); });
    var svg = $('flowchart');
    if (!svg || !state.layout) return;
    if (kind === 'svg') return runExport(function () { return exportSvg(svg, state.sop.title); });
    if (kind === 'png') return runExport(function () { return exportPng(svg, state.sop.title); });
    var breaks = state.layout.rows.map(function (r) { return r.y + r.h; });
    return runExport(function () { return exportDoc(svg, state.sop.title, breaks); });
  }

  function openJson(file) {
    readJsonFile(file).then(function (raw) {
      var next = normalizeSop(raw);
      if (!next || !next.steps.length) throw new Error();
      setSop(next);
      state.sopId = null; state.projectName = ''; setUrl(null);
      state.selectedId = null; state.saveState = 'idle';
      render(); renderSaveButton();
      showToast('Fail JSON dibuka');
    }).catch(function () { showToast('Fail JSON tidak sah'); });
  }

  function startNew() {
    setSop(blankSop());
    state.sopId = null; state.projectName = ''; setUrl(null);
    state.selectedId = null; state.saveState = 'idle';
    render(); renderSaveButton();
  }

  /* ---------- Rendering ---------- */
  function renderSaveButton() {
    var s = state.saveState;
    $('btn-save').disabled = s === 'saving';
    $('save-icon').innerHTML = s === 'saving' ? icon('loader-circle', 'size-4 spin') : s === 'saved' ? icon('check') : icon('save');
    $('save-label').textContent = s === 'saved' ? 'Disimpan' : 'Simpan';
    icons();
  }

  function renderChart() {
    state.layout = layoutSop(state.sop, measure);
    var pa = $('print-area');
    pa.style.maxWidth = state.layout.width * state.zoom + 'px';
    pa.innerHTML = flowChartSvg(state.layout, state.selectedId);
    $('zoom-label').textContent = Math.round(state.zoom * 100) + '%';
  }

  function sigOf(step) {
    var terminal = step.type === 'start' || step.type === 'end';
    var connector = step.type === 'connectorStart' || step.type === 'connectorEnd';
    return step.type + '|' + (terminal ? 't' : '') + (connector ? 'c' : '');
  }

  function field(label, inner) { return '<label class="field"><span>' + label + '</span>' + inner + '</label>'; }
  function checkbox(f, label) { return '<label class="check"><input type="checkbox" data-f="' + f + '"><span>' + esc(label) + '</span></label>'; }

  function cardInner(step) {
    var terminal = step.type === 'start' || step.type === 'end';
    var connector = step.type === 'connectorStart' || step.type === 'connectorEnd';
    var typeOpts = STEP_TYPES.map(function (t) { return '<option value="' + t + '">' + esc(STEP_TYPE_LABEL[t]) + '</option>'; }).join('');
    var labelLabel = step.type === 'decision' ? 'Soalan dalam rombus (pilihan)' : connector ? 'Teks dalam bulatan (pilihan)' : 'Teks dalam kotak (pilihan)';
    var labelPh = step.type === 'decision' ? 'cth. Lengkap?' : connector ? 'cth. A' : 'Biarkan kosong untuk kotak kosong';
    var h = '';
    h += '<div class="card" data-card>';
    h += '<div class="card-top">';
    h += '<span class="num" data-num></span>';
    h += '<label class="type-wrap"><span class="sr-only">Jenis langkah</span><select class="type-select" data-f="type">' + typeOpts + '</select><span class="type-icon" data-icon></span></label>';
    h += '<div class="card-actions">' +
      '<button type="button" class="icon-btn" data-act="up" title="Naik" aria-label="Naik">' + icon('arrow-up') + '</button>' +
      '<button type="button" class="icon-btn" data-act="down" title="Turun" aria-label="Turun">' + icon('arrow-down') + '</button>' +
      '<button type="button" class="icon-btn" data-act="dup" title="Salin" aria-label="Salin">' + icon('copy') + '</button>' +
      '<button type="button" class="icon-btn danger" data-act="del" title="Padam" aria-label="Padam">' + icon('trash-2') + '</button></div>';
    h += '</div>';
    h += '<div class="stack">';
    if (!terminal) h += field('Jawatan', '<input class="input" data-f="responsibility" placeholder="cth. PiK / PiKK(TBK)">');
    h += field('Proses Kerja', '<textarea rows="2" class="input" data-f="description" placeholder="Terangkan proses kerja"></textarea>');
    h += field(labelLabel, '<input class="input" data-f="label" placeholder="' + esc(labelPh) + '">');
    if (step.type === 'connectorEnd') h += '<p class="hint">Penyambung Akhir tidak disambungkan dengan anak panah ke langkah seterusnya.</p>';
    h += checkbox('highlight', 'Highlight Kuning');
    if (!terminal) {
      h += field('Tempoh Masa', '<div class="row"><input type="number" min="0" step="any" class="input w-24" data-f="duration" placeholder="-">' +
        '<select class="input flex-1" data-f="unit"><option>Minit</option><option>Jam</option><option>Hari</option></select></div>');
    }
    if (step.type === 'decision') {
      h += '<div class="tidak-box"><div class="stack">' +
        '<p class="t-title">Laluan “Tidak”</p>' +
        field('Tindakan jika Tidak', '<textarea rows="2" class="input" data-f="noText" placeholder="cth. Diserahkan semula kepada agen untuk pembetulan"></textarea>') +
        '<p class="hint">Teks panjang dibalut secara automatik dan kotak membesar mengikut kandungan.</p>' +
        checkbox('noHighlight', 'Highlight Kuning kotak “Tidak”') +
        field('Kemudian kembali ke', '<select class="input" data-f="loopTo"></select>') +
        '</div></div>';
    }
    h += '</div></div>';
    return h;
  }

  function patchCard(entry, step, index) {
    var li = entry.li;
    var card = li.firstElementChild;
    card.classList.toggle('selected', step.id === state.selectedId);
    li.querySelector('[data-num]').textContent = String(index + 1);
    var isFirst = index === 0, isLast = index === state.sop.steps.length - 1;
    li.querySelector('[data-act="up"]').disabled = isFirst;
    li.querySelector('[data-act="down"]').disabled = isLast;

    var iconKey = TYPE_ICON[step.type] + '|' + step.highlight;
    var iconHost = li.querySelector('[data-icon]');
    if (iconHost.dataset.key !== iconKey) {
      iconHost.dataset.key = iconKey;
      iconHost.innerHTML = icon(TYPE_ICON[step.type], 'size-3_5' + (step.highlight ? ' fill-marker' : ''));
      icons();
    }

    li.querySelectorAll('[data-f]').forEach(function (el) {
      var f = el.getAttribute('data-f');
      if (el.type === 'checkbox') {
        el.checked = !!step[f];
        el.nextElementSibling.className = step[f] ? 'on' : '';
        return;
      }
      if (f === 'loopTo') {
        var opts = '<option value="">— Tiada anak panah —</option>' + state.sop.steps.map(function (s, i) {
          return s.id === step.id ? '' : '<option value="' + esc(s.id) + '">Langkah ' + (i + 1) + ': ' + esc((s.description || STEP_TYPE_LABEL[s.type]).slice(0, 40)) + '</option>';
        }).join('');
        if (el.dataset.sig !== opts) { el.innerHTML = opts; el.dataset.sig = opts; }
        el.value = step.loopTo || '';
        return;
      }
      var v = f === 'duration' ? (step.duration == null ? '' : String(step.duration)) : step[f];
      if (el.tagName === 'SELECT') { el.value = v; return; }
      if (el !== document.activeElement && el.value !== v) el.value = v;
    });
  }

  function renderSteps() {
    var ol = $('steps');
    var steps = state.sop.steps;
    var keep = {};
    steps.forEach(function (step, i) {
      keep[step.id] = true;
      var entry = cardEls.get(step.id);
      var sig = sigOf(step);
      if (entry && entry.sig !== sig) {
        var fresh = document.createElement('li');
        fresh.innerHTML = cardInner(step);
        fresh.dataset.id = step.id;
        ol.replaceChild(fresh, entry.li);
        entry = { li: fresh, sig: sig };
        cardEls.set(step.id, entry);
        icons();
      } else if (!entry) {
        var li = document.createElement('li');
        li.innerHTML = cardInner(step);
        li.dataset.id = step.id;
        entry = { li: li, sig: sig };
        cardEls.set(step.id, entry);
        ol.appendChild(li);
        icons();
      }
      patchCard(entry, step, i);
    });
    cardEls.forEach(function (entry, id) {
      if (!keep[id]) { if (entry.li.parentNode) entry.li.parentNode.removeChild(entry.li); cardEls.delete(id); }
    });
    // keep DOM order identical to state order
    steps.forEach(function (step, i) {
      var li = cardEls.get(step.id).li;
      if (ol.children[i] !== li) ol.insertBefore(li, ol.children[i] || null);
    });
    $('steps-title').textContent = 'Langkah (' + steps.length + ')';
    $('total-pill').textContent = 'Jumlah: ' + totalDuration(steps);
  }

  function render() { renderSteps(); renderChart(); }

  /* ---------- Editor events ---------- */
  function stepIdOf(el) { var li = el.closest('li[data-id]'); return li ? li.dataset.id : null; }

  var stepsEl = $('steps');
  stepsEl.addEventListener('click', function (e) {
    var id = stepIdOf(e.target);
    if (!id) return;
    var btn = e.target.closest('[data-act]');
    if (btn && !btn.disabled) {
      e.stopPropagation();
      var act = btn.getAttribute('data-act');
      if (act === 'up') moveStep(id, -1);
      else if (act === 'down') moveStep(id, 1);
      else if (act === 'dup') duplicateStep(id);
      else if (act === 'del') removeStep(id);
      return;
    }
    if (state.selectedId !== id) { state.selectedId = id; render(); }
  });
  stepsEl.addEventListener('focusin', function (e) {
    var id = stepIdOf(e.target);
    if (id && state.selectedId !== id) { state.selectedId = id; render(); }
  });
  function onField(e) {
    var el = e.target;
    var f = el.getAttribute && el.getAttribute('data-f');
    if (!f) return;
    if (e.type === 'input' && (el.type === 'checkbox' || el.tagName === 'SELECT')) return;
    if (e.type === 'change' && !(el.type === 'checkbox' || el.tagName === 'SELECT')) return;
    var id = stepIdOf(el);
    if (!id) return;
    var patch = {};
    if (el.type === 'checkbox') patch[f] = el.checked;
    else if (f === 'duration') patch[f] = el.value === '' ? null : Number(el.value);
    else if (f === 'loopTo') patch[f] = el.value || null;
    else patch[f] = el.value;
    updateStep(id, patch);
  }
  stepsEl.addEventListener('input', onField);
  stepsEl.addEventListener('change', onField);

  $('btn-add').addEventListener('click', addStep);
  $('btn-new').addEventListener('click', startNew);
  $('btn-lib').addEventListener('click', openLibrary);
  $('btn-json-open').addEventListener('click', function () { $('json-input').click(); });
  $('json-input').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) openJson(file);
  });
  $('btn-save').addEventListener('click', openSaveDialog);
  $('zoom-out').addEventListener('click', function () { state.zoom = Math.max(0.4, +(state.zoom - 0.1).toFixed(1)); renderChart(); });
  $('zoom-in').addEventListener('click', function () { state.zoom = Math.min(1.6, +(state.zoom + 0.1).toFixed(1)); renderChart(); });
  $('print-area').addEventListener('click', function (e) {
    var r = e.target.closest && e.target.closest('[data-ui="row"]');
    if (r) selectFromChart(r.getAttribute('data-step'));
  });

  /* Export menu */
  (function () {
    var wrap = $('export-wrap'), menu = $('export-menu'), btn = $('btn-export');
    function setOpen(o) {
      menu.hidden = !o;
      btn.setAttribute('aria-expanded', String(o));
      btn.querySelector('.chev').classList.toggle('open', o);
    }
    btn.addEventListener('click', function () { setOpen(menu.hidden); });
    menu.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-kind]');
      if (!b) return;
      setOpen(false);
      exportAs(b.getAttribute('data-kind'));
    });
    document.addEventListener('mousedown', function (e) { if (!menu.hidden && !wrap.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', function (e) { if (!menu.hidden && e.key === 'Escape') setOpen(false); });
  })();

  /* ---------- Overlays: save dialog + library drawer ---------- */
  var overlayKeyHandler = null;
  function closeOverlay(kind) {
    var host = $('overlays');
    var el = host.querySelector('[data-overlay="' + kind + '"]');
    if (el) el.remove();
    if (overlayKeyHandler) { document.removeEventListener('keydown', overlayKeyHandler); overlayKeyHandler = null; }
  }

  function openSaveDialog() {
    if (state.saveState === 'saving') return;
    var host = $('overlays');
    closeOverlay('dialog');
    var isUpdate = state.sopId != null;
    var wrap = document.createElement('div');
    wrap.className = 'overlay-dialog no-print';
    wrap.setAttribute('data-overlay', 'dialog');
    wrap.innerHTML =
      '<form class="dialog">' +
        '<div class="dialog-head"><h2>' + (isUpdate ? 'Simpan Perubahan' : 'Simpan SOP') + '</h2>' +
        '<button type="button" class="icon-btn" data-close title="Tutup" aria-label="Tutup">' + icon('x', 'size-5') + '</button></div>' +
        '<label class="field"><span>Nama Projek</span><input class="input-plain" id="project-name" maxlength="200" placeholder="Contoh: SOP Semakan Borang Kastam 8"></label>' +
        '<p class="d-note">Nama ini dipaparkan di “SOP Saya” supaya mudah dicari dan dibuka semula.</p>' +
        '<div class="d-actions"><button type="button" class="btn-cancel" data-close>Batal</button>' +
        '<button type="submit" class="btn-ok">' + icon('save') + 'Simpan</button></div>' +
      '</form>';
    host.appendChild(wrap);
    icons();
    var input = wrap.querySelector('#project-name');
    input.value = state.projectName || state.sop.title;
    input.focus(); input.select();
    wrap.addEventListener('click', function (e) { if (e.target === wrap || e.target.closest('[data-close]')) closeOverlay('dialog'); });
    wrap.querySelector('form').addEventListener('submit', function (e) { e.preventDefault(); handleSave(input.value); });
    overlayKeyHandler = function (e) { if (e.key === 'Escape') closeOverlay('dialog'); };
    document.addEventListener('keydown', overlayKeyHandler);
  }

  function openLibrary() {
    var host = $('overlays');
    closeOverlay('drawer');
    var wrap = document.createElement('div');
    wrap.className = 'overlay-drawer no-print';
    wrap.setAttribute('data-overlay', 'drawer');
    wrap.innerHTML =
      '<div class="drawer">' +
        '<div class="drawer-head"><h2>SOP Saya</h2><button type="button" class="icon-btn" data-close title="Tutup" aria-label="Tutup">' + icon('x', 'size-5') + '</button></div>' +
        '<div id="lib-search" class="search-wrap" hidden><label class="search">' + icon('search') + '<input id="lib-q" placeholder="Cari nama projek…"></label></div>' +
        '<div class="drawer-body" id="lib-body"></div>' +
      '</div>';
    host.appendChild(wrap);
    icons();
    wrap.addEventListener('click', function (e) { if (e.target === wrap || e.target.closest('[data-close]')) closeOverlay('drawer'); });
    overlayKeyHandler = function (e) { if (e.key === 'Escape') closeOverlay('drawer'); };
    document.addEventListener('keydown', overlayKeyHandler);

    var body = wrap.querySelector('#lib-body');
    var searchWrap = wrap.querySelector('#lib-search');
    var q = wrap.querySelector('#lib-q');
    var items = null, error = false;

    function draw() {
      searchWrap.hidden = !(items && items.length > 0);
      if (error) {
        body.innerHTML = '<div class="err-box">Tidak dapat memuatkan senarai. <button type="button" data-retry>Cuba lagi</button></div>';
        return;
      }
      if (items === null) { body.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
      if (items.length === 0) {
        body.innerHTML = '<div class="empty">' + icon('diamond', 'size-10 fill-marker') + '<p class="e-title">Belum ada SOP disimpan</p><p class="e-sub">Bina carta alir anda dan tekan “Simpan” untuk menyimpannya di sini.</p></div>';
        icons();
        return;
      }
      var term = q.value.trim().toLowerCase();
      var filtered = items.filter(function (it) { return !term || ((it.projectName || '') + ' ' + it.title).toLowerCase().indexOf(term) > -1; });
      var html = '<ul class="lib-list">';
      if (!filtered.length) html += '<li class="lib-none">Tiada projek sepadan dengan “' + esc(q.value) + '”.</li>';
      filtered.forEach(function (it) {
        var date = '';
        try { date = new Date(it.updatedAt).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { date = it.updatedAt; }
        html += '<li class="lib-item' + (it.id === state.sopId ? ' current' : '') + '" data-id="' + esc(it.id) + '">' +
          '<button type="button" class="open-btn" data-open><p class="l-name">' + esc(it.projectName || it.title) + '</p>' +
          (it.projectName && it.projectName !== it.title ? '<p class="l-title">' + esc(it.title) + '</p>' : '') +
          '<p class="l-date">Dikemas kini ' + esc(date) + '</p></button>' +
          '<button type="button" class="icon-btn danger" data-del title="Padam" aria-label="Padam">' + icon('trash-2') + '</button></li>';
      });
      html += '</ul>';
      body.innerHTML = html;
      icons();
    }

    function load() {
      error = false; items = null; draw();
      Store.list().then(function (xs) { items = xs; draw(); }).catch(function () { error = true; draw(); });
    }

    body.addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]')) { load(); return; }
      var li = e.target.closest('li[data-id]');
      if (!li) return;
      var id = li.getAttribute('data-id');
      if (e.target.closest('[data-del]')) {
        if (!window.confirm('Padam SOP ini?')) return;
        Store.remove(id).then(function () {
          items = (items || []).filter(function (x) { return x.id !== id; });
          draw();
        }).catch(function () { showToast('Gagal memadam SOP'); });
        return;
      }
      if (e.target.closest('[data-open]')) openSop(id);
    });
    q.addEventListener('input', draw);
    load();
  }

  /* ---------- Start ---------- */
  render();
  renderSaveButton();
  icons();
  try {
    var initial = new URLSearchParams(window.location.search).get('sop');
    if (initial) openSop(initial);
  } catch (e) { /* ignore */ }

  if (window.__EXPOSE_TEST__) window.__t = { layoutSop: layoutSop, wrapText: wrapText, normalizeSop: normalizeSop, blankSop: blankSop, makeStep: makeStep, totalDuration: totalDuration };
})();
</script>
</body>
</html>
